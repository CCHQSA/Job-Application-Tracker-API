<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statistics - JobTrack</title>
  <link rel="stylesheet" th:href="@{/css/applications.css}">
</head>
<body class="dashboard-body">
<aside class="sidebar">
  <div class="sidebar-brand">JobTrack</div>
  <nav class="sidebar-menu">
    <a th:href="@{/home}"
       class="menu-item"
       th:classappend="${activeTab == 'home' ? 'active' : ''}">Dashboard</a>
    <a th:href="@{/applications}"
       class="menu-item"
       th:classappend="${activeTab == 'applications' ? 'active' : ''}">Applications</a>
    <a th:href="@{/interviews}"
       class="menu-item"
       th:classappend="${activeTab == 'interviews' ? 'active' : ''}">Interviews</a>
    <a th:href="@{/statistics}"
       class="menu-item"
       th:classappend="${activeTab == 'statistics' ? 'active' : ''}">Statistics</a>
    <a href="/settings"
       class="menu-item"
       th:classappend="${activeTab == 'settings' ? 'active' : ''}">Settings</a>
  </nav>
  <div class="sidebar-footer">
    <a th:href="@{/logout}" class="logout-link">Log Out</a>
  </div>
</aside>

<main class="dashboard-container">
  <header class="dashboard-header">
    <h1>Statistics</h1>
  </header>

  <div class="stats-overview">
    <div class="stat-card">
      <h3>Total Applications</h3>
      <div class="stat-number color-primary" th:text="${totalApplications}">0</div>
    </div>
    <div class="stat-card">
      <h3>Interviews</h3>
      <div class="stat-number color-success" th:text="${totalInterviews}">0</div>
    </div>
  </div>
</main>
</body>
</html>
